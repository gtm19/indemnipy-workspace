name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: Check formatting
        id: fmt
        run: uvx ruff format --check .
      - name: Check linting
        id: lint
        run: uvx ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv sync --all-packages --locked
      - name: Run basedpyright
        id: pyright
        run: uv run --with basedpyright basedpyright --level error

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv sync --all-packages --group dev --locked
      - name: Run tests
        id: pytest
        run: uv run pytest
