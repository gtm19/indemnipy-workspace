name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: Check formatting
        id: fmt
        run: uvx nox -s lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv sync --all-packages --locked
      - name: Run basedpyright
        id: pyright
        run: uvx nox -s typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: Run tests
        id: pytest
        run: uvx nox -s tests

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: Run smoke test
        run: uvx nox -s smoke
