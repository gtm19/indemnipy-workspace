name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: Check formatting
        id: fmt
        run: uvx ruff format --check . 2>&1 | tee /tmp/fmt-output.txt
        continue-on-error: true
      - name: Check linting
        id: lint
        run: uvx ruff check . 2>&1 | tee /tmp/lint-output.txt
        continue-on-error: true
      - name: Build comment
        if: steps.fmt.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: |
          echo "## Lint & Format Issues" > /tmp/lint-comment.md
          if [ "${{ steps.fmt.outcome }}" = "failure" ]; then
            printf "\n### Formatting — run \`uvx ruff format .\` to fix\n\`\`\`\n" >> /tmp/lint-comment.md
            cat /tmp/fmt-output.txt >> /tmp/lint-comment.md
            printf "\`\`\`\n" >> /tmp/lint-comment.md
          fi
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            printf "\n### Linting — run \`uvx ruff check --fix .\` to fix\n\`\`\`\n" >> /tmp/lint-comment.md
            cat /tmp/lint-output.txt >> /tmp/lint-comment.md
            printf "\`\`\`\n" >> /tmp/lint-comment.md
          fi
      - uses: marocchino/sticky-pull-request-comment@v3
        if: steps.fmt.outcome == 'failure' || steps.lint.outcome == 'failure'
        with:
          header: lint-results
          path: /tmp/lint-comment.md
      - uses: marocchino/sticky-pull-request-comment@v3
        if: steps.fmt.outcome == 'success' && steps.lint.outcome == 'success'
        with:
          header: lint-results
          delete: true
      - name: Fail if checks failed
        if: steps.fmt.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: exit 1

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv sync --all-packages --locked
      - name: Run basedpyright
        id: pyright
        run: uv run --with basedpyright basedpyright --level error 2>&1 | tee /tmp/pyright-output.txt
        continue-on-error: true
      - name: Truncate output
        if: steps.pyright.outcome == 'failure'
        run: |
          python3 -c "
          t = open('/tmp/pyright-output.txt').read()
          out = t[:60000] + '\n…(truncated)' if len(t) > 60000 else t
          open('/tmp/pyright-comment.md', 'w').write('## Type Check Errors\n\nbasedpyright found errors (warnings are OK):\n\`\`\`\n' + out + '\n\`\`\`')
          "
      - uses: marocchino/sticky-pull-request-comment@v3
        if: steps.pyright.outcome == 'failure'
        with:
          header: typecheck-results
          path: /tmp/pyright-comment.md
      - uses: marocchino/sticky-pull-request-comment@v3
        if: steps.pyright.outcome == 'success'
        with:
          header: typecheck-results
          delete: true
      - name: Fail if errors found
        if: steps.pyright.outcome == 'failure'
        run: exit 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - run: uv sync --all-packages --group dev --locked
      - name: Run tests
        id: pytest
        run: uv run pytest 2>&1 | tee /tmp/pytest-output.txt
        continue-on-error: true
      - name: Truncate output
        if: steps.pytest.outcome == 'failure'
        run: |
          python3 -c "
          t = open('/tmp/pytest-output.txt').read()
          out = t[:60000] + '\n…(truncated)' if len(t) > 60000 else t
          open('/tmp/pytest-comment.md', 'w').write('## Test Failures\n\n\`\`\`\n' + out + '\n\`\`\`')
          "
      - uses: marocchino/sticky-pull-request-comment@v3
        if: steps.pytest.outcome == 'failure'
        with:
          header: test-results
          path: /tmp/pytest-comment.md
      - uses: marocchino/sticky-pull-request-comment@v3
        if: steps.pytest.outcome == 'success'
        with:
          header: test-results
          delete: true
      - name: Fail if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
