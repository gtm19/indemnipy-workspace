name: Release indemnipy-ai

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indemnipy-ai
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
      - name: Get version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('packages/indemnipy-ai/pyproject.toml','rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: uv build --package indemnipy-ai
      - name: Publish to PyPI
        run: uv publish
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: indemnipy-ai-v${{ steps.version.outputs.version }}
          name: indemnipy-ai v${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  docs:
    needs: release
    uses: ./.github/workflows/docs.yml
