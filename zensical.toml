[project]
site_url = "https://docs.indemnipy.com"
site_name = "indemnipy"
site_description = "Python packages for insurance"
site_author = "Gareth Maddock"

# copyright = "Copyright &copy; 2026 Gareth Maddock"

repo_url = "https://github.com/gtm19/indemnipy-workspace"
repo_name = "gtm19/indemnipy-workspace"
# edit_uri = "edit/main/docs/"

nav = [
  { "indemnipy" = "index.md" },
  { "indemnipy-ai" = [
    { "Overview" = "indemnipy-ai/overview.md" },
    { "Getting Started" = "indemnipy-ai/getting-started.md" },
    { "API Reference" = "indemnipy-ai/api-reference.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

[project.theme.icon]
logo = "lucide/shield-check"

[project.theme.font]
text = "Plus Jakarta Sans"
code = "Fira Code"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "black"
accent = "teal"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/gtm19/indemnipy-workspace"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
pymdownx.arithmatex = { generic = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets = { base_path = "includes" }
pymdownx.superfences = { custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["packages/indemnipy-ai/src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://docs.pydantic.dev/latest/objects.inv",
  "https://pydantic.dev/docs/ai/objects.inv",
  "https://docs.pola.rs/api/python/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_bases = true
show_root_heading = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
filters = ["!^_"]
