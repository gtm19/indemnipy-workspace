[project]
name = "indemnipy-ai"
version = "0.1.0"
description = "pydantic-ai capabilities for working with Excel files"
readme = "README.md"
authors = [
    { name = "Gareth Maddock", email = "gtmaddock@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.5",
    "oletools>=0.60.2",
    "openpyxl>=3.1.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pydantic-ai>=2.27.0",
    "python-dateutil>=2.9.0",
    "typing-extensions>=4.16.0",
]
license = "MIT"
license-files = ["LICEN[CS]E"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
